name: Alerte Action Logement

on:
  schedule:
    - cron: "*/15 * * * *"   # toutes les 15 min (GitHub peut retarder de quelques minutes)
  workflow_dispatch:           # bouton "Run workflow" pour tester

permissions:
  contents: write

concurrency:
  group: al-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Verifier les offres
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python check.py
      - name: Sauvegarder les offres vues
        run: |
          git config user.name "al-bot"
          git config user.email "al-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "maj offres vues" && git push)
